services:
  chebutap:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/chebutap:${IMAGE_TAG:-latest}
    container_name: chebutap
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - default
      - dating-bot_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dating-bot_default:
    external: true
