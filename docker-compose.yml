services:
  chebutap:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/chebutap:${IMAGE_TAG:-latest}
    container_name: chebutap
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
