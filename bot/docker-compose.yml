services:
  chebutap-bot:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/chebutap-bot:${IMAGE_TAG:-latest}
    container_name: chebutap-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Клон репозитория, node_modules и сессии Claude (~/.claude) переживают перезапуск.
      - bot-home:/home/node
    mem_limit: 3g

volumes:
  bot-home:
