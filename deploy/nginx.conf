server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Public metadata fetched by TON wallets through the HTTPS ingress.
  location = /tonconnect-manifest.json {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    return 200 '{"url":"https://$host","name":"ЧебуТап","iconUrl":"https://$host/figma/tap-coin-clean.png"}';
  }

  # Telegram Mini App / SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
