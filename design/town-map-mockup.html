<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town map mockup</title>
<style>
  body{margin:0;background:#cfe3a8;font-family:Nunito,system-ui,sans-serif;}
  .phone{position:relative;width:375px;height:812px;overflow:hidden;margin:0 auto;background:#a9c27f;}
  .head{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  h2{margin:0;color:#fff;font-size:30px;font-weight:900;text-shadow:0 2px 0 #6a4a22,0 0 6px #6a4a22aa}
  .sub{color:#fff;font-weight:800;font-size:13px;margin-top:2px;text-shadow:0 1px 2px #4a3214}
  .x{width:44px;height:44px;border-radius:10px;background:#b8743a;border:3px solid #6a3f18;color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 3px 0 #5a3412}
  .map{position:absolute;inset:0;bottom:88px;overflow:hidden;cursor:grab;touch-action:none}
  .world{position:absolute;width:900px;height:900px;background:url(sprites/town-map-raw.webp) 0 0/100% no-repeat}
  .bld{position:absolute;width:243px;transform:translateY(-100%);}
  .bld img{width:100%;display:block}
  .bld.locked img{filter:grayscale(1) brightness(1.08) contrast(.9)}
  .bld.sel img{filter:grayscale(1) brightness(1.08) contrast(.9) drop-shadow(0 0 4px #ffd45a) drop-shadow(0 0 4px #ffd45a)}
  .lock{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
  .lock i{width:40px;height:40px;border-radius:50%;background:#6b4520;border:3px solid #f4c96a;display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:0 3px 0 #3e260e}
  .lock b{background:#6b4520;color:#f4c96a;font-size:11px;padding:2px 9px;border-radius:9px;border:2px solid #3e260e}
  .tag{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:#3d9a3a;color:#fff;font-weight:900;font-size:13px;padding:4px 12px;border-radius:14px;border:3px solid #fff;white-space:nowrap;box-shadow:0 2px 0 #2a6a28}
  .walker{position:absolute;width:40px;height:40px;margin:-36px 0 0 -20px;background:url(/figma/restaurant/customer-boy.webp) 0 0/400% 400% no-repeat;animation:legs .6s steps(4) infinite}
  .walker.girl{background-image:url(/figma/restaurant/customer-girl.webp)}
  .walker.back{background-position-y:33.33%}
  @keyframes legs{from{background-position-x:0}to{background-position-x:133.33%}}
  .w1{animation:legs .6s steps(4) infinite,p1 11s linear infinite}
  .w2{animation:legs .6s steps(4) infinite,p2 13s linear infinite}
  .w3{animation:legs .6s steps(4) infinite,p3 9s linear infinite}
  @keyframes p1{from{left:300px;top:470px}to{left:470px;top:565px}}
  @keyframes p2{from{left:620px;top:560px}to{left:470px;top:478px}}
  @keyframes p3{from{left:395px;top:345px}to{left:540px;top:425px}}
  .nav{position:absolute;left:0;right:0;bottom:0;height:88px;background:#8a5426;border-top:4px solid #5e3712;display:flex;gap:5px;padding:10px 8px;box-sizing:border-box;z-index:6}
  .nav div{flex:1;background:#a96a35;border:2px solid #5e3712;border-radius:9px;color:#fff;font-weight:800;font-size:11px;display:grid;place-items:end center;padding-bottom:6px}
  .nav .on{background:#c98a45;border-color:#f4c96a}
  .card{position:absolute;z-index:6;left:16px;right:16px;bottom:100px;background:#6b4520;border:3px solid #3e260e;border-radius:14px;padding:10px 12px;color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 #3e260e}
  .card img{width:56px;height:56px;object-fit:contain;filter:grayscale(1);background:#b8743a;border:2px solid #3e260e;border-radius:10px}
  .card b{font-size:16px}.card small{display:block;color:#f2dcb0;font-weight:700;margin-top:2px}
  .btn{margin-left:auto;background:#8d6a45;border:2px solid #3e260e;border-radius:9px;padding:9px 12px;font-weight:900;color:#f2dcb0;opacity:.75}
</style></head><body>
<div class="phone">
  <div class="head"><div><h2>Город</h2><div class="sub">Открыто 1 из 6 ресторанов</div></div><div class="x">✕</div></div>
  <div class="map" id="map"><div class="world" id="world">
    <!-- позиции в пикселях карты 2000×2000 × 0.45; низ ресторана = центр площадки + 150 -->
    <div class="bld locked" style="left:121px;top:263px"><img src="town/pizza.png"><div class="lock"><i>🔒</i><b>Скоро</b></div></div>
    <div class="bld locked" style="left:584px;top:222px"><img src="town/sushi.png"><div class="lock"><i>🔒</i><b>Скоро</b></div></div>
    <div class="walker girl back w2"></div>
    <div class="walker w3"></div>
    <div class="bld locked sel" style="left:529px;top:431px"><img src="town/bakery.png"><div class="lock"><i>🔒</i><b>Скоро</b></div></div>
    <div class="bld" style="left:329px;top:531px"><img src="town/cheburek.png"><div class="tag">Ваше кафе</div></div>
    <div class="walker w1"></div>
    <div class="bld locked" style="left:23px;top:824px"><img src="town/burger.png"><div class="lock"><i>🔒</i><b>Скоро</b></div></div>
    <div class="bld locked" style="left:640px;top:842px"><img src="town/coffee.png"><div class="lock"><i>🔒</i><b>Скоро</b></div></div>
  </div></div>
  <div class="card"><img src="town/bakery.png"><div><b>Пекарня</b><small>Закрыта · откроется позже</small></div><div class="btn">Скоро</div></div>
  <div class="nav"><div>Еда</div><div>Задачи</div><div class="on">Город</div><div>Улучшения</div><div>Аккаунт</div></div>
</div>
<script>
  const map=document.getElementById('map'),w=document.getElementById('world');let x=-345,y=-120,d=null;
  const put=()=>{w.style.left=x+'px';w.style.top=y+'px'};put();
  map.onpointerdown=e=>{d={sx:e.clientX,sy:e.clientY,x,y};map.setPointerCapture(e.pointerId)};
  map.onpointermove=e=>{if(!d)return;x=Math.min(0,Math.max(375-900,d.x+e.clientX-d.sx));y=Math.min(0,Math.max(724-900,d.y+e.clientY-d.sy));put()};
  map.onpointerup=()=>d=null;
</script>
</body></html>
